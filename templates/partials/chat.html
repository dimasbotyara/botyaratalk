
<section class="chat" id="chat" hidden aria-labelledby="room-title">
  <header class="room-header">
    <svg class="room-header__icon" aria-hidden="true"><use href="#i-hash"></use></svg>
    <h1 class="room-header__title" id="room-title">—</h1>

    <div class="room-header__actions">
      <button type="button" class="voice-pill" id="voice-pill" hidden
              data-i18n-title="voice.open_stage" data-i18n-aria-label="voice.open_stage">
        <span class="voice-pill__dot" aria-hidden="true"></span>
        <span data-i18n="voice.connected">In the voice channel</span>
      </button>

    </div>
  </header>

  <div class="chat__scroll" id="chat-scroll">
    <div class="chat__list" id="chat-list" role="log" aria-live="polite" aria-relevant="additions">
      
    </div>

    <div class="chat__empty" id="chat-empty" hidden>
      <svg class="chat__empty-icon" aria-hidden="true"><use href="#i-sparkles"></use></svg>
      <span class="chat__empty-title" data-i18n="chat.empty">Nothing here yet</span>
      <span data-i18n="chat.empty_hint">Write the first message in this room</span>
    </div>
  </div>

  <div class="typing" id="typing-indicator" aria-live="polite"></div>

  <div class="composer__reply-bar" id="composer-reply" hidden></div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer__box">
      <textarea class="composer__input" id="composer-input" rows="1" maxlength="{{ 2000 }}"
                data-i18n-placeholder="chat.placeholder" data-i18n-aria-label="a11y.message_input"
                data-i18n-params='{{ {"room": ""} | tojson }}'></textarea>
      <span class="composer__counter" id="composer-counter" hidden></span>
      <button type="submit" class="btn btn--primary btn--icon btn--sm composer__send" id="composer-send"
              data-i18n-aria-label="chat.send" data-i18n-title="chat.send">
        <svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg>
      </button>
    </div>
  </form>
</section>
