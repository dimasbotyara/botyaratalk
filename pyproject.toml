# Настройки инструментов проекта botyaratalk
[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["static/vendor", "instance", "screenshots"]

[tool.ruff.lint]
# F — ошибки pyflakes (неиспользуемые импорты/переменные), E9 — синтаксис,
# I — порядок импортов, W — базовые предупреждения
select = ["F", "E9", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы «длинные» файлы и импорты внутри функций
"tests/*" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
